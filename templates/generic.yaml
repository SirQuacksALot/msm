id: generic
display_name: "Generic Minecraft Server"
detect: {}
fields:
  server:
    port:        { type: int,    default: 25565, editable: true }
    motd:        { type: string, default: "A Minecraft Server", editable: true }
    max_players: { type: int,    default: 20,    editable: true }
    difficulty:  { type: enum,   values: [peaceful, easy, normal, hard], default: normal, editable: true }
    gamemode:    { type: enum,   values: [survival, creative, adventure, spectator], default: survival, editable: true }
  managed:
    data_path: { type: string, default: "/data", editable: false }
    rcon:      { type: object, default: { enabled: true, port: 25575 }, editable: false }